<div class="kr-pre" id="kr-pre" role="status" aria-label="正在接入统合档案">
  <div class="kr-pre__grid" aria-hidden="true"></div>
  <div class="kr-pre__scan" aria-hidden="true"></div>
  <div class="kr-pre__stage">
    <p class="kr-pre__eyebrow"><span>KAMEN RIDER</span><i>ARCHIVE · 1971—2026</i></p>
    <div class="kr-pre__core" aria-hidden="true"><span class="kr-pre__ring"></span><span class="kr-pre__ring is-dash"></span><span class="kr-pre__arc"></span><span class="kr-pre__eye"></span></div>
    <p class="kr-pre__count"><b data-num>000</b><i>/ 100</i><em data-phase>核心同步</em></p>
    <div class="kr-pre__verse"><p><span>谨以此卡，纪念我失去的时光</span></p><p><span>那是一段小有遗憾的美好时光</span></p></div>
    <p class="kr-pre__hint">点击任意处跳过</p>
  </div>
  <div class="kr-pre__bar" aria-hidden="true"><i data-bar></i></div>
</div>
<script>
/* 加载页驱动：内联在首屏，不依赖外部脚本，避免网络等待把开场拖到 4s 之后 */
(function () {
  var el = document.getElementById('kr-pre');
  var done = false, rt;
  window.KR_PRELOAD = { ready: new Promise(function (r) { rt = r; }) };
  function skip() {
    try { if (/[?&]nointro=1/.test(location.search) || sessionStorage.getItem('kr:pre') === 'done') return true; } catch (e) {}
    return false;
  }
  function end() {
    if (done) return; done = true;
    try { sessionStorage.setItem('kr:pre', 'done'); } catch (e) {}
    if (el) {
      el.classList.add('is-out');
      document.documentElement.classList.remove('kr-pre-lock');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 520);
    }
    rt();
  }
  if (!el) { rt(); return; }
  if (skip()) { if (el.parentNode) el.parentNode.removeChild(el); rt(); return; }
  document.documentElement.classList.add('kr-pre-lock');
  var num = el.querySelector('[data-num]'), bar = el.querySelector('[data-bar]'),
      arc = el.querySelector('.kr-pre__arc'), ph = el.querySelector('[data-phase]'),
      t0 = Date.now(), DUR = 2300, canSkip = false;
  setTimeout(function () { canSkip = true; el.classList.add('is-ready'); }, 650);
  document.addEventListener('click', function () { if (canSkip) end(); });
  document.addEventListener('keydown', function (e) { if (canSkip && e.key === 'Escape') end(); });
  (function tick() {
    if (done) return;
    var t = Math.min(1, (Date.now() - t0) / DUR), p = Math.round(t * 100);
    if (num) num.textContent = ('00' + p).slice(-3);
    if (bar) bar.style.transform = 'scaleX(' + t + ')';
    if (arc) arc.style.setProperty('--p', String(t));
    if (ph) ph.textContent = p < 34 ? '核心同步' : (p < 72 ? '档案校验' : '线路接入');
    if (t < 1) requestAnimationFrame(tick); else end();
  })();
  setTimeout(end, DUR + 900);   // 墙钟兜底
})();
</script>
